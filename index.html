<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة XO المتطورة</title>
    <style>
        /* أنماط عامة */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 95%;
        }

        /* لوحة اللعبة */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 2rem 0;
        }

        .cell {
            width: 100%;
            aspect-ratio: 1;
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cell:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        /* التحكم في اللعبة */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 25px;
            background: #23a6d5;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* المودال */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
        }

        /* الصفحة المتجاوبة */
        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            
            .cell {
                font-size: 2rem;
            }
            
            button {
                padding: 0.6rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 1rem; color: #333;">لعبة XO الذكية</h1>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="controls">
            <button onclick="startNewGame('ai')">اللعب ضد الكمبيوتر</button>
            <button onclick="startNewGame('friend')">اللعب مع صديق</button>
            <button onclick="restartGame()">إعادة اللعبة</button>
        </div>

        <div id="status" style="text-align: center; margin: 1rem 0; font-size: 1.2rem; color: #333;"></div>
    </div>

    <!-- مودال إنشاء/الدخول إلى روم -->
    <div id="roomModal" class="modal">
        <div class="modal-content">
            <h3>ادخل رمز الروم</h3>
            <input type="text" id="roomCode" placeholder="اكتب الرمز هنا">
            <button onclick="joinRoom()">الدخول</button>
            <button onclick="createRoom()">إنشاء روم جديد</button>
        </div>
    </div>

    <script>
        let currentPlayer = 'X';
        let gameMode = null;
        let gameActive = true;
        let roomId = null;
        const cells = document.querySelectorAll('.cell');
        const status = document.getElementById('status');

        const winCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // أفقي
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // عمودي
            [0, 4, 8], [2, 4, 6] // قطري
        ];

        // بدء لعبة جديدة
        function startNewGame(mode) {
            gameMode = mode;
            if (mode === 'friend') {
                showRoomModal();
            } else {
                resetBoard();
                if (mode === 'ai' && currentPlayer === 'O') {
                    setTimeout(aiMove, 500);
                }
            }
        }

        // إظهار مودال الروم
        function showRoomModal() {
            document.getElementById('roomModal').style.display = 'flex';
        }

        // إنشاء روم جديد
        function createRoom() {
            roomId = Math.random().toString(36).substr(2, 5).toUpperCase();
            alert(`تم إنشاء الروم! رمز الروم: ${roomId}`);
            resetBoard();
            document.getElementById('roomModal').style.display = 'none';
        }

        // الدخول إلى روم موجود
        function joinRoom() {
            const code = document.getElementById('roomCode').value;
            if (code.length === 5) {
                roomId = code;
                resetBoard();
                document.getElementById('roomModal').style.display = 'none';
            } else {
                alert('الرجاء إدخال رمز صحيح (5 أحرف)');
            }
        }

        // حركة الذكاء الاصطناعي
        function aiMove() {
            if (!gameActive || gameMode !== 'ai' || currentPlayer !== 'O') return;

            const emptyCells = [...cells].filter(cell => !cell.textContent);
            if (emptyCells.length === 0) return;

            // خوارزمية minimax للذكاء الاصطناعي
            const bestMove = getBestMove();
            setTimeout(() => {
                handleCellClick(bestMove);
            }, 500);
        }

        function getBestMove() {
            let bestScore = -Infinity;
            let bestMove;

            for (let i = 0; i < cells.length; i++) {
                if (!cells[i].textContent) {
                    cells[i].textContent = 'O';
                    let score = minimax(false);
                    cells[i].textContent = '';
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            return cells[bestMove];
        }

        function minimax(isMaximizing) {
            const result = checkWinner();
            if (result !== null) {
                return result === 'O' ? 1 : result === 'X' ? -1 : 0;
            }

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < cells.length; i++) {
                    if (!cells[i].textContent) {
                        cells[i].textContent = 'O';
                        let score = minimax(false);
                        cells[i].textContent = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < cells.length; i++) {
                    if (!cells[i].textContent) {
                        cells[i].textContent = 'X';
                        let score = minimax(true);
                        cells[i].textContent = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        // التحقق من الفوز
        function checkWinner() {
            for (let combo of winCombinations) {
                const [a, b, c] = combo;
                if (cells[a].textContent &&
                    cells[a].textContent === cells[b].textContent &&
                    cells[a].textContent === cells[c].textContent) {
                    return cells[a].textContent;
                }
            }
            return [...cells].every(cell => cell.textContent) ? 'draw' : null;
        }

        // إعادة تعيين اللعبة
        function restartGame() {
            resetBoard();
            gameActive = true;
            currentPlayer = 'X';
            status.textContent = '';
        }

        function resetBoard() {
            cells.forEach(cell => {
                cell.textContent = '';
                cell.style.backgroundColor = '';
            });
        }

        // التعامل مع النقر على الخلايا
        cells.forEach(cell => {
            cell.addEventListener('click', () => handleCellClick(cell));
        });

        function handleCellClick(cell) {
            const index = cell.dataset.index;

            if (!gameActive || cell.textContent !== '' || 
                (gameMode === 'ai' && currentPlayer === 'O')) return;

            cell.textContent = currentPlayer;
            
            const winner = checkWinner();
            if (winner) {
                gameActive = false;
                if (winner === 'draw') {
                    status.textContent = 'تعادل!';
                } else {
                    status.textContent = `${winner} فاز!`;
                    highlightWinningCombination();
                }
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                status.textContent = `دور اللاعب: ${currentPlayer}`;

                if (gameMode === 'ai') {
                    aiMove();
                }
            }
        }

        // إضاءة الخلايا الفائزة
        function highlightWinningCombination() {
            for (let combo of winCombinations) {
                const [a, b, c] = combo;
                if (cells[a].textContent &&
                    cells[a].textContent === cells[b].textContent &&
                    cells[a].textContent === cells[c].textContent) {
                    cells[a].style.backgroundColor = '#c8e6c9';
                    cells[b].style.backgroundColor = '#c8e6c9';
                    cells[c].style.backgroundColor = '#c8e6c9';
                    break;
                }
            }
        }

        // بدء اللعبة الأولية
        restartGame();
    </script>
</body>
</html>
